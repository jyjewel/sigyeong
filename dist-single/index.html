bel:`낙엽이 끝없이 떨어짐`,sprite:`leaves_falling`,correct:!0},{label:`새싹이 돋아남`,sprite:`leaves_sprouting`}],explanation:`‘落木’은 잎 지는 나무, ‘蕭蕭’는 잎이 떨어지는 쓸쓸한 소리로, 끝없는 숲에서 낙엽이 우수수 진다.`,hint:`‘落’과 ‘下’가 무엇을 가리키는지 생각해 보세요.`,acquire:`낙엽`},{line:`不盡長江滾滾來`,prompt:`강물은 어떻게 흐르고 있을까?`,choices:[{label:`끝없이 밀려오는 물결`,sprite:`river_rolling`,correct:!0},{label:`얼어붙은 강물`,sprite:`river_frozen`},{label:`고요하게 멈춘 수면`,sprite:`river_calm`}],explanation:`‘滾滾’은 물이 세차게 굽이치며 흐르는 모양으로, 다함없는 장강이 이쪽으로 끝없이 밀려온다.`,hint:`‘滾滾’과 ‘來’가 그리는 물의 움직임을 떠올려 보세요.`,acquire:`밀려오는 강물`},{line:`萬里悲秋常作客`,prompt:`시인은 어떤 처지에 있을까?`,choices:[{label:`고향에서 평온하게 지냄`,sprite:`home_house`},{label:`먼 타향을 떠도는 나그네`,sprite:`traveler_bag`,correct:!0},{label:`손님을 맞이하는 집주인`,sprite:`host_house`}],explanation:`‘作客’은 타향에서 나그네 노릇을 한다는 말로, 시인은 고향에서 만 리 떨어진 곳에서 가을을 맞고 있다.`,hint:`‘作客’의 ‘客’이 누구를 가리키는지 생각해 보세요.`,acquire:`여행 행낭`,note:`행낭은 원문에 직접 나오는 사물이 아니라, 나그네의 처지를 나타내기 위한 게임 속 상징 소품입니다.`},{line:`百年多病獨登臺`,prompt:`높은 누대에는 누가 올라와 있을까?`,choices:[{label:`홀로 올라온 시인`,sprite:`poet_alone`,correct:!0},{label:`함께 놀러 온 친구들`,sprite:`friends_two`},{label:`술잔을 나누는 여러 문인`,sprite:`literati_group`}],explanation:`‘百年’은 한평생, ‘多病’은 잦은 병을 뜻하며, 시인은 병든 몸으로 ‘獨’, 곧 홀로 누대에 올랐다.`,hint:`‘獨’이라는 글자를 다시 보세요.`,acquire:`홀로 선 시인`},{line:`艱難苦恨繁霜鬢`,prompt:`시인의 귀밑머리는 어떤 모습일까?`,choices:[{label:`눈이 내려 쌓여 있음`,sprite:`hair_snow`},{label:`검고 윤기가 흐름`,sprite:`hair_black`},{label:`서리처럼 희어져 있음`,sprite:`poet_white_hair`,correct:!0}],explanation:`‘繁霜鬢’은 서리가 짙게 내린 듯 하얗게 센 귀밑머리로, 고난과 한이 쌓인 세월을 보여 준다.`,hint:`‘霜’이 무엇을 비유하는지 생각해 보세요.`,acquire:`흰 귀밑머리`},{line:`潦倒新停濁酒杯`,prompt:`시인은 술을 어떻게 하고 있을까?`,choices:[{label:`술을 따라 마심`,sprite:`drinking`},{label:`술잔을 내려놓고 마시지 않음`,sprite:`wine_cup_stopped`,correct:!0},{label:`다른 사람과 건배함`,sprite:`toasting`}],explanation:`‘新停’은 요즈음 막 그만두었다는 뜻으로, 쇠락하고 초라해진 시인은 탁주잔마저 내려놓았다.`,hint:`‘停’의 뜻을 다시 생각해 보세요.`,acquire:`내려놓은 탁주잔`}]},f={id:`chunwang`,title:`春望`,poetId:`dufu`,era:`唐`,form:`五言律詩`,lines:[`國破山河在`,`城春草木深`,`感時花濺淚`,`恨別鳥驚心`,`烽火連三月`,`家書抵萬金`,`白頭搔更短`,`渾欲不勝簪`],translation:[`나라는 무너졌어도 산과 강은 그대로이고`,`성에 봄이 오니 풀과 나무만 우거졌다.`,`시절을 슬퍼하니 꽃을 보아도 눈물이 흩뿌려지고`,`이별이 한스러우니 새소리에도 마음이 놀란다.`,`봉화는 석 달 동안 이어지고`,`집에서 온 편지는 만금만큼 귀하다.`,`흰머리는 긁을수록 더 짧아져`,`이제는 비녀조차 이기지 못할 지경이다.`],commentary:`안녹산의 난으로 함락된 장안에 머물던 시기, 지덕(至德) 2년(757) 봄에 지은 것으로 알려진 오언율시이다. 앞의 네 구는 무너진 나라와 변함없는 자연을 맞세우고, 뒤의 네 구는 그치지 않는 전란과 가족 소식에 대한 갈망, 늙어 가는 몸을 차례로 그린다. 게임에서는 장안의 무너진 성벽을 기본 풍경으로 두었다.`,scenes:[{id:`chunwang-main`,background:`chunwang`,from:0,to:7}],questions:[{line:`國破山河在`,prompt:`나라가 무너진 뒤, 산과 강은 어떻게 되었을까?`,choices:[{label:`산과 강도 무너져 사라짐`,sprite:`cw_land_ruined`},{label:`산과 강은 그대로 남아 있음`,sprite:`cw_land_intact`,correct:!0},{label:`산과 강이 불길에 휩싸임`,sprite:`cw_land_burning`}],explanation:`‘國破’와 ‘山河在’가 맞서는 구로, 나라는 무너졌어도 산과 강만은 변함없이 남아 있다.`,hint:`‘在’가 무엇을 뜻하는지 생각해 보세요.`,acquire:`변함없는 산과 강`},{line:`城春草木深`,prompt:`봄이 온 성은 어떤 모습일까?`,choices:[{label:`풀과 나무만 무성하게 우거짐`,sprite:`cw_overgrown`,correct:!0},{label:`사람들로 북적이는 거리`,sprite:`cw_crowd`},{label:`눈 덮인 겨울 성`,sprite:`cw_snow`}],explanation:`‘草木深’은 사람이 떠난 성에 풀과 나무만 깊이 우거졌다는 뜻으로, 봄이 왔어도 황폐한 장안을 보여 준다.`,hint:`‘深’이 무엇을 꾸미는지 보세요.`,acquire:`우거진 풀과 나무`},{line:`感時花濺淚`,prompt:`시절을 슬퍼하는 마음에 꽃은 어떻게 보일까?`,choices:[{label:`활짝 웃는 듯 피어 있음`,sprite:`cw_flowers_bright`},{label:`모두 시들어 떨어짐`,sprite:`cw_flowers_withered`},{label:`꽃 위로 눈물이 흩뿌려짐`,sprite:`cw_flowers_tears`,correct:!0}],explanation:`‘濺淚’는 눈물을 흩뿌린다는 뜻으로, 시절을 슬퍼하는 마음에 아름다운 꽃을 보아도 눈물이 흐른다.`,hint:`‘淚’라는 글자를 다시 보세요.`,acquire:`눈물 젖은 꽃`,note:`눈물을 흘리는 주체를 시인으로 보는 해석과 꽃으로 보는 해석이 모두 있습니다. 게임에서는 꽃 위에 눈물방울을 그렸습니다.`},{line:`恨別鳥驚心`,prompt:`이별이 한스러운 마음에 새는 어떻게 느껴질까?`,choices:[{label:`새소리에도 마음이 놀람`,sprite:`cw_bird_startle`,correct:!0},{label:`새가 평화롭게 노래함`,sprite:`cw_bird_sing`},{label:`새가 둥지에서 잠듦`,sprite:`cw_bird_sleep`}],explanation:`‘驚心’은 마음을 놀라게 한다는 뜻으로, 가족과 헤어진 한 때문에 새가 날아오르는 소리에도 가슴이 철렁한다.`,hint:`‘驚’의 뜻을 생각해 보세요.`,acquire:`놀라 날아오르는 새`},{line:`烽火連三月`,prompt:`봉화는 어떻게 타오르고 있을까?`,choices:[{label:`축제의 불꽃놀이`,sprite:`cw_fireworks`},{label:`봉화가 끊이지 않고 이어짐`,sprite:`cw_beacons`,correct:!0},{label:`한 번 피었다가 꺼짐`,sprite:`cw_beacon_out`}],explanation:`‘烽火’는 전쟁을 알리는 봉화이고 ‘連三月’은 석 달 동안 이어졌다는 뜻으로, 전란이 그치지 않음을 말한다.`,hint:`‘連’이 어떤 상태를 말하는지 보세요.`,acquire:`이어지는 봉화`,note:`‘三月’을 ‘석 달’로 보는 해석과 ‘삼월까지’로 보는 해석이 있습니다.`},{line:`家書抵萬金`,prompt:`집에서 온 편지는 얼마나 귀할까?`,choices:[{label:`읽지 않고 버려짐`,sprite:`cw_letter_tossed`},{label:`편지가 산더미처럼 쌓임`,sprite:`cw_letter_pile`},{label:`만금만큼 귀함`,sprite:`cw_letter_gold`,correct:!0}],explanation:`‘抵萬金’은 만금에 맞먹는다는 뜻으로, 전란 중에 좀처럼 오지 않는 집 편지가 그만큼 귀하다는 말이다.`,hint:`‘萬金’이 무엇을 비유하는지 생각해 보세요.`,acquire:`만금 같은 집 편지`},{line:`白頭搔更短`,prompt:`시인의 흰머리는 어떻게 되었을까?`,choices:[{label:`긁을수록 더 짧고 성글어짐`,sprite:`cw_poet_scratch`,correct:!0},{label:`검은 머리가 길게 자람`,sprite:`cw_poet_longhair`},{label:`머리를 곱게 빗어 올림`,sprite:`cw_poet_combed`}],explanation:`‘搔’는 긁는다는 뜻으로, 근심에 흰머리를 긁을수록 머리카락이 더 짧고 성글어진다.`,hint:`‘白頭’와 ‘短’을 함께 보세요.`,acquire:`흰머리를 긁는 시인`},{line:`渾欲不勝簪`,prompt:`성글어진 머리에 비녀는 어떻게 될까?`,choices:[{label:`화려한 관을 씀`,sprite:`cw_crown`},{label:`비녀를 꽂지 못할 지경`,sprite:`cw_pin_falling`,correct:!0},{label:`비녀가 단단히 꽂혀 있음`,sprite:`cw_pin_firm`}],explanation:`‘不勝簪’은 비녀를 이기지 못한다는 뜻으로, 머리숱이 줄어 이제는 비녀조차 꽂기 어려울 지경이다.`,hint:`‘不勝’의 뜻을 생각해 보세요.`,acquire:`빠져나가는 비녀`}]},p={id:`lvyeshuhuai`,title:`旅夜書懷`,poetId:`dufu`,era:`唐`,form:`五言律詩`,lines:[`細草微風岸`,`危檣獨夜舟`,`星垂平野闊`,`月湧大江流`,`名豈文章著`,`官應老病休`,`飄飄何所似`,`天地一沙鷗`],translation:[`가는 풀 위로 산들바람 부는 강 언덕,`,`높은 돛대 세운 배 한 척이 밤에 홀로 떠 있다.`,`별은 드리워 들판이 드넓고`,`달은 솟구치며 큰 강이 흘러간다.`,`이름이 어찌 문장으로 드러나겠는가,`,`벼슬은 늙고 병들었으니 그만둠이 마땅하리라.`,`정처 없이 떠도는 이 몸은 무엇과 같은가,`,`하늘과 땅 사이 한 마리 갈매기로다.`],commentary:`두보가 만년에 촉(蜀)을 떠나 장강을 따라 내려가던 무렵의 작품으로 보는 견해가 많은 오언율시이다. 앞의 네 구는 배 위에서 본 밤 강의 넓고 고요한 풍경을, 뒤의 네 구는 이루지 못한 이름과 벼슬, 떠도는 신세에 대한 탄식을 담았다. 마지막 구의 갈매기는 넓은 천지 속 시인의 외로운 모습을 비유한다.`,scenes:[{id:`lvye-main`,background:`lvye`,from:0,to:7}],questions:[{line:`細草微風岸`,prompt:`강 언덕의 풀은 어떤 모습일까?`,choices:[{label:`억센 갈대가 폭풍에 꺾임`,sprite:`ly_reeds_storm`},{label:`가는 풀이 산들바람에 흔들림`,sprite:`ly_grass_gentle`,correct:!0},{label:`풀 한 포기 없는 자갈밭`,sprite:`ly_bank_bare`}],explanation:`‘細草’는 가는 풀, ‘微風’은 산들바람으로, 고요한 밤 강 언덕의 풀이 가볍게 흔들린다.`,hint:`‘細’와 ‘微’가 무엇을 꾸미는지 보세요.`,acquire:`산들바람 부는 풀`},{line:`危檣獨夜舟`,prompt:`밤의 강에는 무엇이 떠 있을까?`,choices:[{label:`등불 밝힌 배 여러 척`,sprite:`ly_fleet`},{label:`노 젓는 작은 나룻배`,sprite:`ly_ferry`},{label:`높은 돛대의 배 한 척`,sprite:`ly_boat_mast`,correct:!0}],explanation:`‘危檣’은 높이 솟은 돛대, ‘獨夜舟’는 밤에 홀로 떠 있는 배로, 시인이 탄 배를 가리킨다.`,hint:`‘危’와 ‘獨’을 함께 보세요.`,acquire:`높은 돛대의 외로운 배`},{line:`星垂平野闊`,prompt:`별은 어떻게 보일까?`,choices:[{label:`넓은 들판 끝까지 낮게 드리움`,sprite:`ly_stars_low`,correct:!0},{label:`구름에 가려 보이지 않음`,sprite:`ly_clouds`},{label:`별똥별이 쏟아짐`,sprite:`ly_meteors`}],explanation:`‘星垂’는 별이 드리운다는 뜻으로, 지평선 가까이까지 별이 내려와 보일 만큼 들판이 드넓다.`,hint:`‘垂’와 ‘闊’의 관계를 생각해 보세요.`,acquire:`들판에 드리운 별`},{line:`月湧大江流`,prompt:`달은 강물 위에서 어떻게 보일까?`,choices:[{label:`달이 지고 강이 캄캄함`,sprite:`ly_moon_none`},{label:`달빛이 물결과 함께 솟구침`,sprite:`ly_moon_surge`,correct:!0},{label:`얼어붙은 강에 달이 고요함`,sprite:`ly_moon_ice`}],explanation:`‘月湧’은 달이 솟구친다는 뜻으로, 흘러가는 큰 강의 물결 위에서 달빛이 출렁이며 솟아오르는 듯하다.`,hint:`‘湧’과 ‘流’가 그리는 움직임을 떠올려 보세요.`,acquire:`물결에 솟구치는 달`},{line:`名豈文章著`,prompt:`시인은 문장과 이름을 어떻게 여길까?`,choices:[{label:`문장으로 이름났다고 자랑함`,sprite:`ly_scroll_proud`},{label:`과거에 장원 급제함`,sprite:`ly_exam`},{label:`문장으로 어찌 이름나겠냐며 낮춤`,sprite:`ly_scroll_humble`,correct:!0}],explanation:`‘豈’는 ‘어찌 ~하겠는가’라는 반어로, 이름이 어찌 문장으로 드러나겠느냐며 스스로를 낮추는 말이다.`,hint:`‘豈’가 어떤 어조를 만드는지 보세요.`,acquire:`말아 둔 두루마리`,note:`5~8구는 의미를 소품과 상태 변화로 옮긴 시범 문제입니다. 두루마리는 원문에 직접 나오는 사물이 아니라 ‘文章’을 나타내는 상징 소품입니다.`},{line:`官應老病休`,prompt:`시인의 벼슬은 어떻게 되었을까?`,choices:[{label:`늙고 병들어 벼슬을 내려놓음`,sprite:`ly_hat_down`,correct:!0},{label:`붉은 관복을 입고 승진함`,sprite:`ly_promoted`},{label:`새 관인(官印)을 받음`,sprite:`ly_seal`}],explanation:`‘應’은 ‘마땅히 ~하리라’는 뜻으로, 벼슬은 늙고 병들었으니 그만둠이 마땅하다고 짐짓 체념하듯 말한다.`,hint:`‘老病’과 ‘休’를 함께 보세요.`,acquire:`내려놓은 관모`,note:`관모는 원문에 직접 나오는 사물이 아니라 ‘官’을 나타내는 상징 소품입니다.`},{line:`飄飄何所似`,prompt:`시인의 배는 어떻게 움직이고 있을까?`,choices:[{label:`닻을 내리고 굳게 멈춤`,sprite:`ly_anchored`},{label:`정처 없이 이리저리 떠다님`,sprite:`ly_drifting`,correct:!0},{label:`노를 저어 곧장 나아감`,sprite:`ly_rowing`}],explanation:`‘飄飄’는 바람에 날리듯 정처 없이 떠도는 모양으로, 이리저리 흘러 다니는 시인의 신세를 말한다.`,hint:`‘飄飄’가 그리는 모양을 떠올려 보세요.`,acquire:`정처 없이 떠도는 배`},{line:`天地一沙鷗`,prompt:`천지 사이의 시인은 무엇과 같을까?`,choices:[{label:`모래톱 위 갈매기 한 마리`,sprite:`ly_gull_one`,correct:!0},{label:`떼 지어 나는 기러기`,sprite:`ly_geese`},{label:`짝지어 나는 제비 한 쌍`,sprite:`ly_swallows`}],explanation:`‘一沙鷗’는 모래톱의 갈매기 한 마리로, 넓은 하늘과 땅 사이를 홀로 떠도는 시인 자신을 비유한다.`,hint:`‘一’이라는 글자에 주목해 보세요.`,acquire:`한 마리 갈매기`}]},m={id:`jingyesi`,title:`靜夜思`,poetId:`libai`,era:`唐`,form:`五言絶句`,lines:[`床前明月光`,`疑是地上霜`,`舉頭望明月`,`低頭思故鄉`],translation:[`침상 앞에 밝은 달빛이 비치니`,`땅에 내린 서리인가 싶다.`,`고개 들어 밝은 달을 바라보다가`,`고개 숙여 고향을 생각한다.`],commentary:`고요한 밤 달빛을 보며 고향을 그리는 마음을 담은 오언절구이다. 『唐詩三百首』를 비롯한 통행본은 ‘床前明月光’, ‘舉頭望明月’로 쓰지만, 송대 판본 계통의 이백 문집에는 ‘床前看月光’, ‘舉頭望山月’로 되어 있어 글자에 차이가 있다. 게임은 통행본을 따랐다.`,scenes:[{id:`jingyesi-main`,background:`jingyesi`,from:0,to:3}],questions:[{line:`床前明月光`,prompt:`침상 앞에는 무엇이 비치고 있을까?`,choices:[{label:`아침 햇살`,sprite:`jy_sunlight`},{label:`밝은 달빛`,sprite:`jy_moonlight`,correct:!0},{label:`흔들리는 촛불 빛`,sprite:`jy_candle`}],explanation:`‘明月光’은 밝은 달빛으로, 고요한 밤 침상 앞 바닥에 달빛이 하얗게 비쳐 든다.`,hint:`‘月’이라는 글자를 다시 보세요.`,acquire:`침상 앞의 달빛`,note:`‘床’을 침상이 아니라 우물 난간(井欄)으로 보는 해석도 있습니다. 게임에서는 침상으로 그렸습니다.`},{line:`疑是地上霜`,prompt:`시인은 그 빛을 무엇으로 착각했을까?`,choices:[{label:`땅에 내린 서리`,sprite:`jy_frost`,correct:!0},{label:`바닥에 쏟아진 물`,sprite:`jy_puddle`},{label:`흩어진 흰 꽃잎`,sprite:`jy_petals`}],explanation:`‘疑是’는 ‘~인가 의심하다’는 뜻으로, 바닥에 깔린 하얀 달빛을 땅에 내린 서리로 착각한 것이다.`,hint:`‘霜’이라는 글자를 찾아보세요.`,acquire:`서리 같은 달빛`},{line:`舉頭望明月`,prompt:`시인은 어떤 자세로 있을까?`,choices:[{label:`고개 숙여 책을 읽음`,sprite:`jy_reading`},{label:`누워서 잠이 듦`,sprite:`jy_sleeping`},{label:`고개를 들어 달을 바라봄`,sprite:`jy_look_up`,correct:!0}],explanation:`‘舉頭’는 고개를 든다는 뜻으로, 서리 같은 빛에 이끌려 고개를 들어 창밖의 밝은 달을 바라본다.`,hint:`‘舉頭’와 ‘望’을 함께 보세요.`,acquire:`달을 바라보는 시인`},{line:`低頭思故鄉`,prompt:`고개를 숙인 시인은 무엇을 떠올릴까?`,choices:[{label:`두고 온 고향`,sprite:`jy_think_home`,correct:!0},{label:`내일 열릴 잔치`,sprite:`jy_think_feast`},{label:`높은 벼슬자리`,sprite:`jy_think_office`}],explanation:`‘低頭’는 고개를 숙인다는 뜻으로, 같은 달이 비출 고향을 생각하며 시인은 고개를 떨군다.`,hint:`‘故鄉’의 뜻을 생각해 보세요.`,acquire:`고향 생각`}]},h={id:`huanghelou`,title:`黃鶴樓送孟浩然之廣陵`,poetId:`libai`,era:`唐`,form:`七言絶句`,lines:[`故人西辭黃鶴樓`,`煙花三月下揚州`,`孤帆遠影碧空盡`,`唯見長江天際流`],translation:[`오랜 벗이 서쪽 황학루를 작별하고`,`꽃 안개 자욱한 삼월에 양주로 내려간다.`,`외로운 돛의 먼 그림자가 푸른 하늘 끝으로 사라지고`,`오직 장강만이 하늘 끝으로 흘러가는 것이 보인다.`],commentary:`이백이 무창(武昌)의 황학루에서 광릉, 곧 양주로 떠나는 맹호연(孟浩然)을 배웅하며 지은 칠언절구이다. 앞의 두 구는 이별의 장소와 때를, 뒤의 두 구는 멀어지는 돛을 끝까지 바라보는 시선을 그려, 이별의 정을 직접 말하지 않고 풍경으로 드러낸다. 3구는 판본에 따라 ‘碧山盡’으로 된 것도 있다.`,scenes:[{id:`huanghelou-main`,background:`huanghelou`,from:0,to:3}],questions:[{line:`故人西辭黃鶴樓`,prompt:`누가 황학루를 떠나고 있을까?`,choices:[{label:`창을 든 군사들`,sprite:`hh_soldiers`},{label:`수레를 끄는 장사꾼`,sprite:`hh_merchant`},{label:`오랜 벗`,sprite:`hh_friend`,correct:!0}],explanation:`‘故人’은 오랜 벗으로, 여기서는 맹호연이 황학루를 작별하고 배에 오르려 한다.`,hint:`‘故人’의 뜻을 생각해 보세요.`,acquire:`떠나는 벗`},{line:`煙花三月下揚州`,prompt:`벗이 떠나는 때는 어떤 계절일까?`,choices:[{label:`꽃 안개 자욱한 봄`,sprite:`hh_spring`,correct:!0},{label:`낙엽 지는 가을`,sprite:`hh_autumn`},{label:`눈 내리는 겨울`,sprite:`hh_winter`}],explanation:`‘煙花’는 안개처럼 자욱하게 핀 꽃, ‘三月’은 늦봄으로, 꽃이 한창인 봄날에 양주로 내려간다.`,hint:`‘花’와 ‘三月’을 함께 보세요.`,acquire:`꽃 안개 낀 봄`},{line:`孤帆遠影碧空盡`,prompt:`벗이 탄 배는 어떻게 멀어질까?`,choices:[{label:`외로운 돛이 하늘 끝으로 사라짐`,sprite:`hh_sail_vanish`,correct:!0},{label:`여러 배가 함께 떠남`,sprite:`hh_convoy`},{label:`배가 다시 돌아옴`,sprite:`hh_sail_return`}],explanation:`‘孤帆’은 외로운 돛, ‘碧空盡’은 푸른 하늘 끝에서 다한다는 뜻으로, 돛 그림자가 작아지다가 하늘가로 사라진다.`,hint:`‘孤’와 ‘盡’을 함께 보세요.`,acquire:`사라지는 외로운 돛`},{line:`唯見長江天際流`,prompt:`배가 사라진 뒤 무엇만 보일까?`,choices:[{label:`강을 가득 메운 배들`,sprite:`hh_boats_many`},{label:`모든 것을 가린 짙은 안개`,sprite:`hh_fog`},{label:`하늘 끝까지 흐르는 장강`,sprite:`hh_river_flow`,correct:!0}],explanation:`‘唯見’은 오직 ~만 보인다는 뜻으로, 벗의 배가 사라진 자리에 하늘 끝까지 흐르는 장강만 남는다.`,hint:`‘唯見’ 다음에 오는 말을 보세요.`,acquire:`하늘 끝으로 흐르는 장강`}]},g={id:`luzhai`,title:`鹿柴`,poetId:`wangwei`,era:`唐`,form:`五言絶句`,lines:[`空山不見人`,`但聞人語響`,`返景入深林`,`復照青苔上`],translation:[`빈 산에 사람은 보이지 않고`,`다만 사람 말소리만 울려 온다.`,`저녁 햇빛이 깊은 숲에 들어와`,`다시 푸른 이끼 위를 비춘다.`],commentary:`왕유가 망천(輞川) 별장 일대의 명소를 읊은 『輞川集』 스무 수 가운데 한 수이다. 녹시(鹿柴)는 별장 안의 지명이다. 보이지 않는 사람과 들리는 말소리, 깊은 숲에 잠깐 비쳐 드는 저녁 빛을 맞세워 산의 고요함을 오히려 더 깊게 느끼게 한다.`,scenes:[{id:`luzhai-main`,background:`luzhai`,from:0,to:3}],questions:[{line:`空山不見人`,prompt:`산에는 사람이 보일까?`,choices:[{label:`나무하는 나무꾼`,sprite:`lz_woodcutter`},{label:`텅 빈 산, 사람이 보이지 않음`,sprite:`lz_empty`,correct:!0},{label:`산을 오르는 여러 사람`,sprite:`lz_hikers`}],explanation:`‘空山’은 텅 빈 산, ‘不見人’은 사람이 보이지 않는다는 뜻으로, 안개만 고요히 흐르는 깊은 산이다.`,hint:`‘不見’의 뜻을 생각해 보세요.`,acquire:`고요한 빈 산`},{line:`但聞人語響`,prompt:`그런데 무엇이 들려올까?`,choices:[{label:`어디선가 사람 말소리`,sprite:`lz_voices`,correct:!0},{label:`우렁찬 폭포 소리`,sprite:`lz_waterfall`},{label:`사슴 울음소리`,sprite:`lz_deer`}],explanation:`‘但聞’은 다만 들린다는 뜻으로, 사람은 보이지 않고 숲 어딘가에서 말소리만 울려 온다.`,hint:`‘人語’가 무엇인지 보세요.`,acquire:`어디선가 들리는 말소리`},{line:`返景入深林`,prompt:`저녁 햇빛은 어디로 들어올까?`,choices:[{label:`구름 뒤로 숨어 버림`,sprite:`lz_clouded`},{label:`넓은 호수 위를 비춤`,sprite:`lz_lake_light`},{label:`깊은 숲속으로 비껴 듦`,sprite:`lz_rays`,correct:!0}],explanation:`‘返景’은 저녁 무렵 되비치는 햇빛으로, 그 빛이 비스듬히 깊은 숲속까지 들어온다.`,hint:`‘入深林’을 다시 보세요.`,acquire:`숲에 비껴 드는 저녁 빛`},{line:`復照青苔上`,prompt:`그 빛은 다시 무엇을 비출까?`,choices:[{label:`푸른 이끼`,sprite:`lz_moss`,correct:!0},{label:`붉은 단풍잎`,sprite:`lz_maple`},{label:`하얀 눈`,sprite:`lz_snow`}],explanation:`‘復照’는 다시 비춘다는 뜻으로, 숲에 든 저녁 빛이 바닥의 푸른 이끼 위에 잠시 머문다.`,hint:`‘青苔’의 뜻을 생각해 보세요.`,acquire:`빛을 받은 푸른 이끼`}]},_={id:`shanjuqiuming`,title:`山居秋暝`,poetId:`wangwei`,era:`唐`,form:`五言律詩`,lines:[`空山新雨後`,`天氣晚來秋`,`明月松間照`,`清泉石上流`,`竹喧歸浣女`,`蓮動下漁舟`,`隨意春芳歇`,`王孫自可留`],translation:[`빈 산에 비가 막 그친 뒤,`,`날씨는 저물녘 들어 가을 기운이 완연하다.`,`밝은 달은 소나무 사이로 비치고`,`맑은 샘물은 바위 위로 흐른다.`,`대숲이 떠들썩하니 빨래하던 여인들이 돌아가고`,`연잎이 흔들리니 고깃배가 내려간다.`,`봄꽃이야 제멋대로 다 져도 좋으니`,`왕손은 스스로 이곳에 머물 만하다.`],commentary:`왕유가 망천 일대에 은거하던 시기의 작품으로 알려진 오언율시이다. 비 갠 가을 저녁 산속의 맑은 경물과 그 속에서 살아가는 사람들의 모습을 그린 뒤, 마지막 두 구에서 이곳에 머물겠다는 뜻을 밝힌다. 끝 구는 『楚辭』 「招隱士」의 ‘王孫兮歸來, 山中兮不可以久留’를 뒤집어 쓴 것으로 풀이된다.`,scenes:[{id:`shanju-main`,background:`shanju`,from:0,to:7}],questions:[{line:`空山新雨後`,prompt:`빈 산은 지금 어떤 상태일까?`,choices:[{label:`장대비가 한창 쏟아짐`,sprite:`sj_heavy_rain`},{label:`가뭄으로 메마름`,sprite:`sj_drought`},{label:`비가 막 그쳐 촉촉함`,sprite:`sj_after_rain`,correct:!0}],explanation:`‘新雨後’는 비가 막 그친 뒤라는 뜻으로, 잎끝마다 빗방울이 맺힌 맑고 촉촉한 산이다.`,hint:`‘後’라는 글자를 다시 보세요.`,acquire:`비 갠 뒤의 물기`},{line:`天氣晚來秋`,prompt:`저물녘 날씨는 어떤 계절을 느끼게 할까?`,choices:[{label:`서늘한 가을`,sprite:`sj_autumn`,correct:!0},{label:`무더운 여름`,sprite:`sj_summer`},{label:`매서운 겨울`,sprite:`sj_winter`}],explanation:`‘晚來秋’는 저물녘이 되자 가을 기운이 짙어졌다는 뜻으로, 나뭇잎이 물들고 서늘한 안개가 깔린다.`,hint:`‘秋’라는 글자를 찾아보세요.`,acquire:`저물녘의 가을 기운`},{line:`明月松間照`,prompt:`소나무 사이로 무엇이 비칠까?`,choices:[{label:`한낮의 햇빛`,sprite:`sj_sun`},{label:`밝은 달빛`,sprite:`sj_moon`,correct:!0},{label:`사람들의 횃불`,sprite:`sj_torches`}],explanation:`‘明月’은 밝은 달로, 비 갠 하늘에 뜬 달이 소나무 가지 사이로 맑게 비친다.`,hint:`‘明月’의 뜻을 생각해 보세요.`,acquire:`소나무 사이의 달`},{line:`清泉石上流`,prompt:`맑은 샘물은 어떻게 흐를까?`,choices:[{label:`바위 위로 흘러감`,sprite:`sj_stream`,correct:!0},{label:`얼어붙어 멈춤`,sprite:`sj_stream_frozen`},{label:`말라서 물이 없음`,sprite:`sj_stream_dry`}],explanation:`‘石上流’는 바위 위로 흐른다는 뜻으로, 비 온 뒤 불어난 맑은 샘물이 바위를 타고 흘러간다.`,hint:`‘流’의 뜻을 생각해 보세요.`,acquire:`바위 위로 흐르는 샘물`},{line:`竹喧歸浣女`,prompt:`대숲이 떠들썩한 까닭은 무엇일까?`,choices:[{label:`장터로 가는 상인들`,sprite:`sj_merchants`},{label:`빨래하고 돌아가는 여인들`,sprite:`sj_washers`,correct:!0},{label:`사냥 나온 사냥꾼들`,sprite:`sj_hunters`}],explanation:`‘浣女’는 빨래하는 여인들로, 빨래를 마치고 돌아가는 이들의 말소리에 대숲이 떠들썩하다.`,hint:`‘浣’은 빨래한다는 뜻입니다.`,acquire:`돌아가는 빨래하던 여인들`},{line:`蓮動下漁舟`,prompt:`연잎이 흔들리는 까닭은 무엇일까?`,choices:[{label:`오리 떼가 헤엄쳐서`,sprite:`sj_ducks`},{label:`다시 비가 내려서`,sprite:`sj_rain_lotus`},{label:`고깃배가 내려가서`,sprite:`sj_fishing_boat`,correct:!0}],explanation:`‘下漁舟’는 고깃배가 물길을 따라 내려간다는 뜻으로, 그 배가 지나가며 연잎을 흔든다.`,hint:`‘漁舟’를 찾아보세요.`,acquire:`내려가는 고깃배`},{line:`隨意春芳歇`,prompt:`봄꽃은 어떻게 되었을까?`,choices:[{label:`봄꽃이 만발함`,sprite:`sj_blossom`},{label:`꽃을 꺾어 병에 꽂음`,sprite:`sj_vase`},{label:`제멋대로 다 져 버림`,sprite:`sj_petals_gone`,correct:!0}],explanation:`‘歇’은 다한다는 뜻이고 ‘隨意’는 제멋대로 하라는 말로, 봄꽃이야 다 져도 상관없다는 뜻이다.`,hint:`‘歇’의 뜻을 생각해 보세요.`,acquire:`다 져 버린 봄꽃`},{line:`王孫自可留`,prompt:`王孫은 어떻게 할 수 있을까?`,choices:[{label:`스스로 이곳에 머묾`,sprite:`sj_stay`,correct:!0},{label:`서둘러 산을 떠남`,sprite:`sj_leave`},{label:`말을 타고 조정으로 감`,sprite:`sj_court`}],explanation:`‘自可留’는 스스로 머물 만하다는 뜻으로, 가을 산의 경치가 좋으니 이곳에 남겠다는 뜻을 밝힌다.`,hint:`‘留’의 뜻을 생각해 보세요.`,acquire:`산에 머무는 사람`,note:`‘王孫’은 『楚辭』 「招隱士」에서 산속에 오래 머물지 말고 돌아오라고 부르던 대상입니다. 이 구는 그 말을 뒤집어, 머물러도 좋다고 말합니다.`}]};function v(e,t,n,r,i,a,o){if(n.length!==3)throw Error(`${e}: 보기는 정확히 세 개여야 합니다`);if(n.filter(e=>e[2]).length!==1)throw Error(`${e}: 정답은 하나여야 합니다`);return{line:e,prompt:t,choices:n.map(([e,t,n])=>({label:e,sprite:t,correct:!!n})),explanation:r,hint:i,acquire:a,note:o}}var y={id:`chunxiao`,title:`春曉`,poetId:`menghaoran`,era:`唐`,form:`五言絶句`,lines:[`春眠不覺曉`,`處處聞啼鳥`,`夜來風雨聲`,`花落知多少`],translation:[`봄잠에 날 밝는 줄 몰랐더니`,`곳곳에서 새 우는 소리 들린다.`,`간밤에 비바람 소리 들렸으니`,`꽃은 얼마나 떨어졌을까.`],commentary:`봄날 아침 잠에서 깨어나는 순간을 그린 오언절구이다. 새소리로 아침을 알고, 간밤의 비바람 소리를 떠올리며, 떨어졌을 꽃을 짐작하는 순서로 감각이 이어진다. 눈으로 보는 대신 귀로 듣고 마음으로 헤아리는 방식으로 봄의 정취를 담았다.`,scenes:[{id:`chunxiao-main`,background:`chunxiao`,from:0,to:3}],questions:[v(`春眠不覺曉`,`봄잠에 빠진 시인은 어떤 상태일까?`,[[`밤새 등불 아래 책을 읽음`,`cx_reading`],[`날 밝는 줄 모르고 잠듦`,`cx_sleeping`,!0],[`일찍 일어나 밭을 갊`,`cx_plowing`]],`‘不覺曉’는 새벽이 온 줄 깨닫지 못한다는 뜻으로, 봄잠이 달아 해가 뜬 줄도 모르고 잠들어 있다.`,`‘眠’과 ‘不覺’을 함께 보세요.`,`깊은 봄잠`),v(`處處聞啼鳥`,`곳곳에서 무엇이 들려올까?`,[[`새 우는 소리`,`cx_birds`,!0],[`개 짖는 소리`,`cx_dogs`],[`절의 종소리`,`cx_bell`]],`‘啼鳥’는 우는 새로, 잠을 깨고 보니 여기저기서 새 우는 소리가 들려온다.`,`‘鳥’라는 글자를 찾아보세요.`,`여기저기 우는 새`),v(`夜來風雨聲`,`간밤에는 어떤 소리가 들렸을까?`,[[`거문고 소리`,`cx_night_music`],[`아이들 웃음소리`,`cx_night_laugh`],[`비바람 소리`,`cx_night_storm`,!0]],`‘夜來’는 간밤, ‘風雨聲’은 비바람 소리로, 시인은 잠결에 들었던 비바람을 떠올린다.`,`‘風’과 ‘雨’를 보세요.`,`간밤의 비바람`),v(`花落知多少`,`꽃은 어떻게 되었을까?`,[[`막 꽃봉오리가 맺힘`,`cx_buds`],[`꽃잎이 얼마나 떨어졌을지 모름`,`cx_petals`,!0],[`열매가 주렁주렁 열림`,`cx_fruit`]],`‘知多少’는 얼마나 되는지 알겠느냐는 말로, 간밤 비바람에 꽃이 얼마나 졌을지 헤아려 본다.`,`‘落’의 뜻을 생각해 보세요.`,`떨어진 꽃잎`)]},b={id:`jiangxue`,title:`江雪`,poetId:`liuzongyuan`,era:`唐`,form:`五言絶句`,lines:[`千山鳥飛絕`,`萬徑人蹤滅`,`孤舟蓑笠翁`,`獨釣寒江雪`],translation:[`온 산에 나는 새 끊어지고`,`모든 길에 사람 발자취 사라졌다.`,`외로운 배에 도롱이 입고 삿갓 쓴 늙은이`,`홀로 눈 내리는 차가운 강에서 낚시한다.`],commentary:`유종원이 영주(永州)로 좌천되어 지내던 시기의 작품으로 알려진 오언절구이다. 앞의 두 구는 새도 사람도 사라진 눈 덮인 천지를 크게 그리고, 뒤의 두 구는 그 한가운데 홀로 낚시하는 노인에게 시선을 모은다.`,scenes:[{id:`jiangxue-main`,background:`jiangxue`,from:0,to:3}],questions:[v(`千山鳥飛絕`,`산에는 새가 날고 있을까?`,[[`새 떼가 어지럽게 날아다님`,`jx_birds_flock`],[`매 한 마리가 맴돎`,`jx_hawk`],[`나는 새 한 마리 없이 눈만 내림`,`jx_no_birds`,!0]],`‘鳥飛絕’은 나는 새가 끊어졌다는 뜻으로, 수많은 산에 눈만 내릴 뿐 새 한 마리 보이지 않는다.`,`‘絕’의 뜻을 생각해 보세요.`,`새 끊긴 천 개의 산`),v(`萬徑人蹤滅`,`길에는 무엇이 남아 있을까?`,[[`사람 발자취가 모두 사라짐`,`jx_no_tracks`,!0],[`발자국이 어지럽게 찍힘`,`jx_tracks`],[`나그네들이 오가고 있음`,`jx_travelers`]],`‘人蹤滅’은 사람의 자취가 사라졌다는 뜻으로, 모든 길이 눈에 덮여 발자국 하나 남지 않았다.`,`‘滅’이 무엇을 말하는지 보세요.`,`자취 사라진 길`),v(`孤舟蓑笠翁`,`강 위에는 누가 있을까?`,[[`등불 단 화려한 놀잇배`,`jx_pleasure_boat`],[`도롱이·삿갓 차림 노인의 외로운 배`,`jx_old_man`,!0],[`사람으로 가득한 나룻배`,`jx_ferry_crowd`]],`‘蓑笠’은 도롱이와 삿갓으로, 외로운 배 위에 눈을 막는 차림의 늙은이가 앉아 있다.`,`‘孤’와 ‘翁’을 함께 보세요.`,`도롱이 입은 늙은이`),v(`獨釣寒江雪`,`늙은이는 무엇을 하고 있을까?`,[[`그물을 던짐`,`jx_net`],[`배 위에서 잠이 듦`,`jx_sleep`],[`홀로 낚싯대를 드리움`,`jx_fishing`,!0]],`‘獨釣’는 홀로 낚시한다는 뜻으로, 눈 내리는 차가운 강에 늙은이가 낚싯대를 드리우고 있다.`,`‘釣’의 뜻을 생각해 보세요.`,`홀로 드리운 낚싯대`)]},ee={id:`guanquelou`,title:`登鸛雀樓`,poetId:`wangzhihuan`,era:`唐`,form:`五言絶句`,lines:[`白日依山盡`,`黃河入海流`,`欲窮千里目`,`更上一層樓`],translation:[`밝은 해는 산에 기대어 지고`,`황하는 바다로 흘러 들어간다.`,`천 리 먼 곳까지 다 보고 싶어`,`다시 한 층 누각을 더 오른다.`],commentary:`황하 가의 관작루(鸛雀樓)에 올라 지은 오언절구이다. 앞의 두 구는 지는 해와 바다로 흐르는 황하를 크게 그리고, 뒤의 두 구는 더 멀리 보려고 한 층 더 오르는 마음을 담았다. 작자를 주빈(朱斌)으로 전하는 기록도 있으나 통행본은 왕지환으로 싣는다.`,scenes:[{id:`guanque-main`,background:`guanque`,from:0,to:3}],questions:[v(`白日依山盡`,`해는 어떻게 하고 있을까?`,[[`산에 기대어 저물어 감`,`gq_sunset`,!0],[`바다 위로 막 떠오름`,`gq_sunrise`],[`하늘 한가운데 높이 떠 있음`,`gq_noon`]],`‘依山盡’은 산에 기대어 다한다는 뜻으로, 밝은 해가 서쪽 산 너머로 천천히 진다.`,`‘盡’의 뜻을 생각해 보세요.`,`산에 기대어 지는 해`),v(`黃河入海流`,`황하는 어떻게 흐를까?`,[[`꽁꽁 얼어붙어 멈춤`,`gq_river_frozen`],[`말라서 바닥이 드러남`,`gq_river_dry`],[`바다를 향해 흘러감`,`gq_river_sea`,!0]],`‘入海流’는 바다로 흘러 들어간다는 뜻으로, 황하가 먼 동쪽 바다를 향해 흘러간다.`,`‘入海’를 다시 보세요.`,`바다로 흐르는 황하`),v(`欲窮千里目`,`시인은 무엇을 하고 싶을까?`,[[`누각에서 낮잠을 자고 싶음`,`gq_nap`],[`천 리 끝까지 바라보고 싶음`,`gq_gaze`,!0],[`서둘러 내려가고 싶음`,`gq_descend`]],`‘窮千里目’은 천 리를 다 볼 만큼 눈길을 끝까지 보낸다는 뜻으로, 시인은 더 먼 곳을 보고 싶어 한다.`,`‘千里目’이 무엇인지 생각해 보세요.`,`천 리를 향한 눈길`),v(`更上一層樓`,`그래서 시인은 어떻게 할까?`,[[`그 자리에 앉아 쉼`,`gq_sit`],[`누각을 내려감`,`gq_go_down`],[`한 층 더 올라감`,`gq_climb`,!0]],`‘更上’은 다시 더 오른다는 뜻으로, 더 멀리 보려고 시인은 누각을 한 층 더 올라간다.`,`‘更上’의 뜻을 보세요.`,`한 층 더 오른 시인`)]},te={id:`fengqiao`,title:`楓橋夜泊`,poetId:`zhangji`,era:`唐`,form:`七言絶句`,lines:[`月落烏啼霜滿天`,`江楓漁火對愁眠`,`姑蘇城外寒山寺`,`夜半鐘聲到客船`],translation:[`달은 지고 까마귀 울며 서리 기운 하늘에 가득한데`,`강가 단풍과 고깃배 불빛을 마주하고 시름 속에 잠든다.`,`고소성 밖 한산사에서`,`한밤중 종소리가 나그네 배에 닿는다.`],commentary:`소주(蘇州) 풍교(楓橋) 근처에 배를 대고 묵으며 지은 칠언절구이다. 앞의 두 구는 지는 달과 까마귀 소리, 강가의 단풍과 고깃배 불빛으로 나그네의 시름을 그리고, 뒤의 두 구는 멀리 한산사(寒山寺)의 종소리가 배에 닿는 순간으로 끝맺는다.`,scenes:[{id:`fengqiao-main`,background:`fengqiao`,from:0,to:3}],questions:[v(`月落烏啼霜滿天`,`밤하늘은 어떤 모습일까?`,[[`보름달이 높이 뜬 맑은 밤`,`fq_full_moon`],[`달 지고 까마귀 울며 서리 기운 가득`,`fq_moonset`,!0],[`해가 떠오르는 아침`,`fq_dawn`]],`‘月落’은 달이 지고 ‘烏啼’는 까마귀가 운다는 뜻으로, 서리 기운이 하늘 가득한 차가운 밤이다.`,`‘月落’과 ‘烏啼’를 보세요.`,`지는 달과 우는 까마귀`),v(`江楓漁火對愁眠`,`강가에는 무엇이 보일까?`,[[`단풍나무와 고깃배 불빛`,`fq_maple_fire`,!0],[`버드나무와 연등`,`fq_willow_lantern`],[`소나무와 횃불 행렬`,`fq_pine_torch`]],`‘江楓’은 강가의 단풍, ‘漁火’는 고깃배의 불빛으로, 나그네는 이를 마주하며 시름 속에 잠든다.`,`‘楓’과 ‘漁火’를 찾아보세요.`,`강가 단풍과 고깃배 불빛`),v(`姑蘇城外寒山寺`,`고소성 밖에는 무엇이 있을까?`,[[`북적이는 큰 시장`,`fq_market`],[`군사들의 진영`,`fq_camp`],[`한산사라는 절`,`fq_temple`,!0]],`‘寒山寺’는 고소성, 곧 소주성 밖에 있는 절의 이름이다.`,`‘寺’라는 글자를 보세요.`,`성 밖의 한산사`),v(`夜半鐘聲到客船`,`한밤중 나그네 배에 무엇이 닿을까?`,[[`종소리`,`fq_bell`,!0],[`북소리`,`fq_drum`],[`피리 소리`,`fq_flute`]],`‘鐘聲’은 종소리로, 한산사에서 울린 한밤의 종소리가 나그네가 탄 배까지 들려온다.`,`‘鐘’이라는 글자를 찾아보세요.`,`배에 닿는 종소리`)]},ne={id:`xiajiangling`,title:`下江陵`,poetId:`libai`,era:`唐`,form:`七言絶句`,lines:[`朝辭白帝彩雲間`,`千里江陵一日還`,`兩岸猿聲啼不住`,`輕舟已過萬重山`],translation:[`아침에 채색 구름 사이 백제성을 떠나`,`천 리 강릉을 하루 만에 돌아간다.`,`양쪽 언덕의 원숭이 울음 그치지 않는 사이`,`가벼운 배는 벌써 만 겹 산을 지났다.`],commentary:`백제성(白帝城)에서 장강 삼협을 따라 강릉으로 내려가는 뱃길을 그린 칠언절구로, 〈早發白帝城〉이라는 제목으로도 널리 알려져 있다. 흔히 이백이 유배 도중 사면 소식을 듣고 돌아가던 때의 작품으로 풀이한다. 원숭이 울음이 이어지는 짧은 사이에 만 겹 산을 지났다는 표현으로 배의 빠르기와 홀가분한 마음을 함께 드러낸다.`,scenes:[{id:`xjl-main`,background:`xiajiangling`,from:0,to:3}],questions:[v(`朝辭白帝彩雲間`,`아침의 백제성은 어떤 모습일까?`,[[`짙은 먹구름과 번개`,`xj_storm`],[`채색 구름 사이에 있음`,`xj_clouds`,!0],[`한밤의 어둠 속`,`xj_night`]],`‘彩雲間’은 채색 구름 사이라는 뜻으로, 높은 벼랑 위 백제성이 아침노을에 물든 구름 사이에 있다.`,`‘彩雲’의 뜻을 생각해 보세요.`,`채색 구름 사이의 백제성`),v(`千里江陵一日還`,`배는 얼마나 빨리 갈까?`,[[`천 리를 하루 만에 감`,`xj_fast`,!0],[`느릿느릿 떠내려감`,`xj_slow`],[`물살을 거슬러 올라감`,`xj_upstream`]],`‘千里’ 길을 ‘一日’에 돌아간다는 말로, 물살을 탄 배가 놀랄 만큼 빠르게 내려간다.`,`‘千里’와 ‘一日’을 맞대어 보세요.`,`천 리를 하루에 가는 배`),v(`兩岸猿聲啼不住`,`양쪽 언덕에서는 무슨 소리가 날까?`,[[`호랑이가 포효함`,`xj_tiger`],[`사람들이 환호함`,`xj_cheer`],[`원숭이 울음이 그치지 않음`,`xj_apes`,!0]],`‘猿聲’은 원숭이 울음, ‘啼不住’는 그치지 않고 운다는 뜻으로, 협곡 양쪽에서 울음소리가 이어진다.`,`‘猿’이라는 글자를 찾아보세요.`,`그치지 않는 원숭이 울음`),v(`輕舟已過萬重山`,`가벼운 배는 어디까지 왔을까?`,[[`벌써 만 겹 산을 지남`,`xj_past_mountains`,!0],[`바위에 막혀 멈춤`,`xj_blocked`],[`다시 백제성으로 돌아감`,`xj_return`]],`‘已過’는 이미 지났다는 뜻으로, 가벼운 배가 어느새 첩첩이 겹친 산들을 다 지나왔다.`,`‘已過’의 뜻을 보세요.`,`지나온 만 겹 산`)]},re={id:`zhuliguan`,title:`竹里館`,poetId:`wangwei`,era:`唐`,form:`五言絶句`,lines:[`獨坐幽篁裏`,`彈琴復長嘯`,`深林人不知`,`明月來相照`],translation:[`그윽한 대숲 속에 홀로 앉아`,`거문고 타고 다시 길게 휘파람 분다.`,`깊은 숲이라 사람들은 알지 못하는데`,`밝은 달이 찾아와 비춰 준다.`],commentary:`왕유의 『輞川集』 가운데 한 수로, 죽리관(竹里館)은 망천 별장 안 대숲 속의 집이다. 홀로 거문고를 타고 휘파람을 부는 시인을 아무도 모르지만, 달만은 찾아와 비춘다는 끝맺음으로 은거의 고요함과 자족을 그렸다.`,scenes:[{id:`zlg-main`,background:`zhuliguan`,from:0,to:3}],questions:[v(`獨坐幽篁裏`,`시인은 어떻게 앉아 있을까?`,[[`대숲 속에 홀로 앉음`,`zl_alone`,!0],[`여럿이 둘러앉아 담소함`,`zl_group`],[`서성이며 거닒`,`zl_walking`]],`‘幽篁’은 그윽한 대숲, ‘獨坐’는 홀로 앉는다는 뜻으로, 시인은 깊은 대숲 속에 혼자 앉아 있다.`,`‘獨坐’를 다시 보세요.`,`대숲 속에 홀로 앉은 시인`),v(`彈琴復長嘯`,`시인은 무엇을 하고 있을까?`,[[`바둑을 둠`,`zl_go`],[`책을 소리 내어 읽음`,`zl_read`],[`거문고 타고 길게 휘파람 붊`,`zl_qin`,!0]],`‘彈琴’은 거문고를 탄다, ‘長嘯’는 길게 휘파람 분다는 뜻으로, 시인은 연주와 휘파람으로 홀로 흥을 낸다.`,`‘彈琴’의 뜻을 생각해 보세요.`,`거문고와 휘파람`),v(`深林人不知`,`사람들은 이를 알고 있을까?`,[[`구경꾼이 몰려듦`,`zl_crowd`],[`깊은 숲이라 아무도 모름`,`zl_unknown`,!0],[`하인이 곁에서 시중듦`,`zl_servant`]],`‘人不知’는 사람들이 알지 못한다는 뜻으로, 숲이 깊어 시인이 여기 있는 줄 아무도 모른다.`,`‘不知’의 뜻을 보세요.`,`아무도 모르는 깊은 숲`),v(`明月來相照`,`누가 찾아와 비춰 줄까?`,[[`등불 든 벗`,`zl_friend_lamp`],[`반딧불이 떼`,`zl_fireflies`],[`밝은 달`,`zl_moon`,!0]],`‘明月’이 찾아와 비춘다는 말로, 사람은 몰라도 밝은 달만은 시인을 찾아와 비춰 준다.`,`‘明月’을 찾아보세요.`,`찾아와 비추는 밝은 달`)]},x={id:`jiandejiang`,title:`宿建德江`,poetId:`menghaoran`,era:`唐`,form:`五言絶句`,lines:[`移舟泊煙渚`,`日暮客愁新`,`野曠天低樹`,`江清月近人`],translation:[`배를 옮겨 안개 낀 물가에 대니`,`날 저물어 나그네 시름이 새롭다.`,`들이 넓어 하늘은 나무보다 낮고`,`강이 맑아 달이 사람 가까이 있다.`],commentary:`건덕강(建德江)에 배를 대고 묵으며 지은 오언절구이다. 저물녘 새로 돋는 나그네의 시름을 말한 뒤, 끝없이 넓은 들과 맑은 강물에 비친 달로 시선을 옮긴다. 하늘이 나무보다 낮아 보이고 달이 사람 곁에 있는 듯하다는 대구로 넓은 천지 속 외로움과 위안을 함께 담았다.`,scenes:[{id:`jdj-main`,background:`jiandejiang`,from:0,to:3}],questions:[v(`移舟泊煙渚`,`배를 어디에 댈까?`,[[`번화한 나루터`,`jd_busy_pier`],[`안개 낀 물가 모래톱`,`jd_misty_islet`,!0],[`깎아지른 절벽 아래`,`jd_cliff`]],`‘泊’은 배를 댄다는 뜻이고 ‘煙渚’는 안개 낀 물가로, 시인은 배를 옮겨 안개 자욱한 모래톱에 댄다.`,`‘煙渚’의 뜻을 생각해 보세요.`,`안개 낀 물가에 댄 배`),v(`日暮客愁新`,`해 질 녘 나그네의 마음은 어떨까?`,[[`시름이 새로 돋음`,`jd_sorrow`,!0],[`들떠서 노래함`,`jd_merry`],[`곤히 잠이 듦`,`jd_asleep`]],`‘日暮’는 해 질 녘, ‘客愁新’은 나그네의 시름이 새로워진다는 뜻으로, 저물녘이 되자 외로움이 다시 밀려온다.`,`‘愁’의 뜻을 생각해 보세요.`,`저물녘 나그네의 시름`),v(`野曠天低樹`,`들판의 하늘은 어떻게 보일까?`,[[`높은 산이 하늘을 가림`,`jd_mountains`],[`빽빽한 숲이 하늘을 덮음`,`jd_forest`],[`들이 넓어 하늘이 나무보다 낮음`,`jd_wide_plain`,!0]],`‘野曠’은 들이 넓다는 뜻으로, 끝없는 들판 끝에서 하늘이 나무보다 낮게 내려앉은 듯 보인다.`,`‘曠’과 ‘低’를 함께 보세요.`,`나무보다 낮은 하늘`),v(`江清月近人`,`달은 어디에 있을까?`,[[`맑은 강물에 비쳐 사람 가까이`,`jd_moon_near`,!0],[`구름 속에 숨음`,`jd_moon_hidden`],[`먼 산 뒤로 넘어감`,`jd_moon_far`]],`‘江清’은 강이 맑다는 뜻으로, 맑은 강물에 달이 비쳐 배에 앉은 사람 바로 곁에 있는 듯하다.`,`‘近人’을 다시 보세요.`,`사람 가까이 비친 달`)]},ie={id:`chuzhouxijian`,title:`滁州西澗`,poetId:`weiyingwu`,era:`唐`,form:`七言絶句`,lines:[`獨憐幽草澗邊生`,`上有黃鸝深樹鳴`,`春潮帶雨晚來急`,`野渡無人舟自橫`],translation:[`시냇가에 자란 그윽한 풀을 홀로 아끼는데`,`위에서는 꾀꼬리가 깊은 나무에서 운다.`,`봄 물살은 비를 머금어 저물녘 더욱 세차고`,`들판 나루에는 사람 없이 배만 홀로 가로놓였다.`],commentary:`위응물이 저주(滁州) 자사로 있을 때 성 서쪽 시내를 거닐며 지은 칠언절구로 알려져 있다. 그윽한 풀과 꾀꼬리 소리로 시작해, 비에 불어난 저녁 물살과 사공 없이 가로놓인 배로 끝맺는다. 마지막 구의 한가로운 배는 뒤에 많은 그림의 화제가 되었다.`,scenes:[{id:`cz-main`,background:`chuzhou`,from:0,to:3}],questions:[v(`獨憐幽草澗邊生`,`시냇가에는 무엇이 자랄까?`,[[`화려한 모란`,`cz_peony`],[`그윽한 풀`,`cz_grass`,!0],[`풀 없는 맨바위`,`cz_bare`]],`‘幽草’는 그윽한 풀로, 시인은 시냇가에 조용히 자란 풀을 홀로 아낀다.`,`‘幽草’를 찾아보세요.`,`시냇가의 그윽한 풀`),v(`上有黃鸝深樹鳴`,`깊은 나무 위에서는 무엇이 울까?`,[[`꾀꼬리`,`cz_oriole`,!0],[`까마귀 떼`,`cz_crows`],[`부엉이`,`cz_owl`]],`‘黃鸝’는 꾀꼬리로, 우거진 나무 깊은 곳에서 노란 꾀꼬리가 운다.`,`‘黃鸝’가 어떤 새인지 생각해 보세요.`,`깊은 나무 속 꾀꼬리`),v(`春潮帶雨晚來急`,`저녁의 물살은 어떨까?`,[[`잔잔하게 빠져나감`,`cz_ebb`],[`꽁꽁 얼어붙음`,`cz_frozen`],[`비를 머금고 세차게 불어남`,`cz_flood`,!0]],`‘帶雨’는 비를 띠었다는 뜻이고 ‘晚來急’은 저물녘 들어 세차졌다는 뜻으로, 봄비에 불어난 물살이 빨라진다.`,`‘帶雨’와 ‘急’을 함께 보세요.`,`비 머금은 세찬 물살`),v(`野渡無人舟自橫`,`들판 나루의 배는 어떨까?`,[[`사공이 손님을 태움`,`cz_ferryman`],[`사람 없이 배만 가로놓임`,`cz_empty_boat`,!0],[`배 여러 척이 줄지어 매임`,`cz_boats_tied`]],`‘無人’은 사람이 없다는 뜻이고 ‘自橫’은 저절로 가로놓였다는 뜻으로, 사공 없는 배가 물살에 비스듬히 돌아가 있다.`,`‘無人’과 ‘自橫’을 보세요.`,`홀로 가로놓인 배`)]},S={id:`wuyixiang`,title:`烏衣巷`,poetId:`liuyuxi`,era:`唐`,form:`七言絶句`,lines:[`朱雀橋邊野草花`,`烏衣巷口夕陽斜`,`舊時王謝堂前燕`,`飛入尋常百姓家`],translation:[`주작교 가에는 들풀과 들꽃이 피었고`,`오의항 어귀에는 저녁 해가 비낀다.`,`옛날 왕씨·사씨 집 대청 앞에 깃들던 제비가`,`이제는 평범한 백성의 집으로 날아든다.`],commentary:`유우석의 〈金陵五題〉 가운데 한 수이다. 오의항(烏衣巷)은 금릉(남경)의 골목으로, 동진(東晉) 때 왕도(王導)·사안(謝安) 같은 명문가가 모여 살던 곳이다. 들풀 핀 다리와 저녁 햇살, 백성의 집으로 날아드는 제비로 옛 영화가 사라진 자리를 담담하게 보여 준다.`,scenes:[{id:`wyx-main`,background:`wuyixiang`,from:0,to:3}],questions:[v(`朱雀橋邊野草花`,`주작교 곁에는 무엇이 있을까?`,[[`들풀과 들꽃`,`wy_wildflowers`,!0],[`잘 가꾼 화분의 꽃`,`wy_pots`],[`화려한 수레 행렬`,`wy_carriages`]],`‘野草花’는 들풀과 들꽃으로, 옛날 번화하던 다리 곁에 이제는 들꽃만 피어 있다.`,`‘野’라는 글자에 주목해 보세요.`,`다리 곁 들꽃`),v(`烏衣巷口夕陽斜`,`골목 어귀에는 무엇이 비칠까?`,[[`한낮의 장터 햇살`,`wy_noon_market`],[`달빛과 등불`,`wy_lanterns`],[`비스듬한 저녁 햇살`,`wy_sunset`,!0]],`‘夕陽斜’는 저녁 해가 비스듬히 비친다는 뜻으로, 쓸쓸한 골목 어귀에 저무는 햇빛이 기운다.`,`‘夕陽’의 뜻을 생각해 보세요.`,`비스듬한 저녁 햇살`),v(`舊時王謝堂前燕`,`옛날 이 제비는 어디에 깃들었을까?`,[[`새장 속`,`wy_cage`],[`왕씨·사씨 명문가의 대청 앞`,`wy_old_hall`,!0],[`궁궐 연못가`,`wy_palace`]],`‘王謝’는 동진의 명문가인 왕씨와 사씨로, 제비는 옛날 그 집 대청 앞에 깃들던 새이다.`,`‘王謝堂前’을 다시 보세요.`,`옛 명문가의 제비`),v(`飛入尋常百姓家`,`지금 제비는 어디로 날아들까?`,[[`다시 큰 저택으로`,`wy_mansion`],[`평범한 백성의 집으로`,`wy_commoners`,!0],[`멀리 남쪽 바다로`,`wy_sea`]],`‘尋常百姓家’는 평범한 백성의 집으로, 명문가가 사라진 자리에 제비는 이제 보통 사람들의 집으로 날아든다.`,`‘百姓家’의 뜻을 생각해 보세요.`,`백성의 집으로 드는 제비`)]},ae={id:`boqinhuai`,title:`泊秦淮`,poetId:`dumu`,era:`唐`,form:`七言絶句`,lines:[`煙籠寒水月籠沙`,`夜泊秦淮近酒家`,`商女不知亡國恨`,`隔江猶唱後庭花`],translation:[`안개는 차가운 물을, 달빛은 모래를 감싸는데`,`밤에 진회에 배를 대니 술집이 가깝다.`,`노래 파는 여인은 나라 잃은 한을 알지 못하고`,`강 건너에서 여전히 〈후정화〉를 부른다.`],commentary:`두목이 금릉(남경)의 진회하(秦淮河)에 배를 대고 지은 칠언절구이다. 〈後庭花〉는 남조 진(陳)의 마지막 임금 후주(後主)가 지었다는 〈玉樹後庭花〉로, 흔히 나라를 망친 노래로 일컬어진다. 안개와 달빛에 싸인 밤 강에서 그 노래를 아무렇지 않게 부르는 모습을 통해 지난 역사를 잊은 세태를 꼬집었다.`,scenes:[{id:`qh-main`,background:`qinhuai`,from:0,to:3}],questions:[v(`煙籠寒水月籠沙`,`물과 모래는 어떤 모습일까?`,[[`햇살 아래 반짝이는 물`,`qh_sunny`],[`안개는 물을, 달빛은 모래를 감쌈`,`qh_mist_moon`,!0],[`폭우에 불어난 강`,`qh_flood`]],`‘籠’은 감싼다는 뜻으로, 안개는 차가운 강물을, 달빛은 모래톱을 부드럽게 감싸고 있다.`,`‘煙’과 ‘月’이 각각 무엇을 감싸는지 보세요.`,`안개와 달빛`),v(`夜泊秦淮近酒家`,`밤에 배를 어디에 댈까?`,[[`쓸쓸한 갈대밭`,`qh_reeds`],[`관청 나루`,`qh_office`],[`술집 가까운 곳`,`qh_tavern`,!0]],`‘近酒家’는 술집이 가깝다는 뜻으로, 진회하 기슭 불 밝힌 술집 가까이에 배를 댄다.`,`‘酒家’를 찾아보세요.`,`술집 가까이 댄 배`),v(`商女不知亡國恨`,`노래 파는 여인은 어떤 모습일까?`,[[`나라 잃은 한을 모른 채 노래함`,`qh_singer`,!0],[`눈물 흘리며 슬퍼함`,`qh_weeping`],[`짐을 싸서 피란함`,`qh_fleeing`]],`‘商女’는 노래를 팔던 여인이고 ‘不知’는 알지 못한다는 뜻으로, 여인은 망국의 한을 모른 채 흥겹게 노래한다.`,`‘不知’의 뜻을 생각해 보세요.`,`노래하는 여인`),v(`隔江猶唱後庭花`,`그 노랫소리는 어디서 들릴까?`,[[`강 건너편에서 여전히 들림`,`qh_song_across`,!0],[`노래가 그쳐 고요함`,`qh_silent`],[`군대의 북소리가 울림`,`qh_drums`]],`‘隔江’은 강을 사이에 두었다는 뜻이고 ‘猶唱’은 여전히 부른다는 뜻으로, 강 건너에서 〈후정화〉가 계속 들려온다.`,`‘隔江’과 ‘猶’를 함께 보세요.`,`강 건너의 노랫소리`)]},oe=[{id:`dufu`,name:`杜甫`,era:`唐`,badge:{id:`dufu-journey`,name:`두보의 여행`,description:`수록된 두보의 작품을 모두 완성했습니다.`}},{id:`libai`,name:`李白`,era:`唐`,badge:{id:`libai-moon`,name:`이백의 달`,description:`수록된 이백의 작품을 모두 완성했습니다.`}},{id:`wangwei`,name:`王維`,era:`唐`,badge:{id:`wangwei-landscape`,name:`왕유의 산수`,description:`수록된 왕유의 작품을 모두 완성했습니다.`}},{id:`menghaoran`,name:`孟浩然`,era:`唐`,badge:{id:`menghaoran-spring`,name:`맹호연의 봄잠`,description:`수록된 맹호연의 작품을 모두 완성했습니다.`}},{id:`wangzhihuan`,name:`王之渙`,era:`唐`,badge:{id:`wangzhihuan-tower`,name:`왕지환의 누각`,description:`수록된 왕지환의 작품을 모두 완성했습니다.`}},{id:`zhangji`,name:`張繼`,era:`唐`,badge:{id:`zhangji-bell`,name:`장계의 종소리`,description:`수록된 장계의 작품을 모
